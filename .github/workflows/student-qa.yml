name: Student QA - Chromium browser tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'qa/**'
      - '.github/workflows/student-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: 100 exercises and browser interactions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Test complete student app locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/aiworklab-http.log 2>&1 &
          node qa/smoke.cjs
